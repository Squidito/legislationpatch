<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Orange left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f97316"/>

  <!-- Subtle top line -->
  <rect x="6" y="0" width="1194" height="2" fill="#f97316" opacity="0.25"/>

  <!-- Main wordmark -->
  <text x="80" y="295"
        font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1">LegislationPatch</text>

  <!-- Orange tagline -->
  <text x="80" y="365"
        font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="600" fill="#f97316">U.S. Federal Bills, Plain English</text>

  <!-- Sub-tagline -->
  <text x="80" y="415"
        font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="22" fill="#64748b">Sourced directly from bill text. No editorial spin.</text>

  <!-- Bottom domain label -->
  <text x="1120" y="600"
        font-family="ui-monospace, Menlo, monospace"
        font-size="18" fill="#475569" text-anchor="end">legislationpatch.com</text>
</svg>
