<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bill — LegislationPatch</title>
  <meta name="description" content="Full bill analysis and text — LegislationPatch" />
  <link rel="canonical" href="https://legislationpatch.com/bill.html" />

  <!-- Open Graph / Social — values updated dynamically by bill.js once bill data loads -->
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://legislationpatch.com/bill.html" />
  <meta property="og:title" content="Bill Analysis — LegislationPatch" />
  <meta property="og:description" content="Full bill analysis and plain-English summary — LegislationPatch" />
  <meta property="og:image" content="https://legislationpatch.com/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bill Analysis — LegislationPatch" />
  <meta name="twitter:description" content="Full bill analysis and plain-English summary — LegislationPatch" />
  <meta name="twitter:image" content="https://legislationpatch.com/og-image.svg" />

  <!-- Structured data — populated by bill.js once bill data loads -->
  <script type="application/ld+json" id="bill-schema"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>

  <!-- Apply saved theme before paint -->
  <script>
    (function() {
      var t = localStorage.getItem('lpTheme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-block" style="text-decoration:none" aria-label="Return to home">
        <img src="logo.svg" alt="LegislationPatch" class="logo-img" />
      </a>
      <div class="header-cta">
        <span class="header-cta__label">Take it with you</span>
        <div class="header-cta__badges">
          <a href="#" class="app-store-badge" aria-label="Download on the App Store">
            <svg class="app-store-badge__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
            </svg>
            <span class="app-store-badge__text">
              <span class="app-store-badge__line1">Download on the</span>
              <span class="app-store-badge__line2">App Store</span>
            </span>
          </a>
          <a href="#" class="app-store-badge" aria-label="Get it on Google Play">
            <svg class="app-store-badge__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span class="app-store-badge__text">
              <span class="app-store-badge__line1">Get it on</span>
              <span class="app-store-badge__line2">Google Play</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <div class="trust-bar-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sourced directly from bill text. No editorial spin.
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-bar">
    <div class="controls-inner">
      <a id="backBtn" href="index.html" class="back-btn">&larr; Bills</a>
      <div class="header-track">
        <label class="theme-toggle" title="Toggle dark mode">
          <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)" />
          <svg class="theme-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div id="bill-loading" class="loading-state" style="display:none">
      <div class="loading-spinner"></div>
      <p>Loading bill...</p>
    </div>

    <div class="bills-list" id="bill-card-mount"></div>
    <div id="analysis-toggle-row"></div>
    <div class="bills-list" id="bill-text-mount"></div>
  </main>

  <script src="api.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script src="bill.js?v=4"></script>
  <script src="share-highlight.js"></script>

</body>
</html>
