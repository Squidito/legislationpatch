<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://bioguide.congress.gov https://clerk.house.gov; connect-src 'self' https://ipapi.co https://api.zippopotam.us; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Redirecting — LegislationPatch</title>
  <!-- This is no longer a content page. Bills now live at /bill/<slug>/ ; this shell
       only redirects previously shared ?id= links to their new home. Kept out of the
       index (no canonical here) so the real bill page is the only indexed URL. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles-shared.css" />
  <link rel="stylesheet" href="/styles-bills.css" />
  <link rel="stylesheet" href="/styles-pages.css" />

  <!-- Resolve ?id=<id> to the current /bill/<slug>/ URL and hand off immediately. -->
  <script>
    (function () {
      try { if (localStorage.getItem('lpTheme') !== 'light') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
      var id = new URLSearchParams(location.search).get('id');
      if (!id) { location.replace('/'); return; }
      fetch('/data/slug-index.json')
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (map) {
          var slug = map && map[id];
          if (slug) location.replace('/bill/' + slug + '/');
          else location.replace('/bill-pending?id=' + encodeURIComponent(id));
        })
        .catch(function () { location.replace('/bill-pending?id=' + encodeURIComponent(id)); });
    })();
  </script>
</head>
<body>
  <main class="main">
    <div class="loading-state" style="display:flex">
      <div class="loading-spinner"></div>
      <p>Redirecting to this bill&hellip;</p>
    </div>
  </main>
</body>
</html>
